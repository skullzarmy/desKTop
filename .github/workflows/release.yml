name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Application
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Extract Tag / Version
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ "$TAG" = "$GITHUB_REF" ] || [ -z "$TAG" ]; then
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building release for tag $TAG"

      - name: Build & Package Release Bundle and DMG
        run: |
          ./scripts/bundle.sh --release
          cd build
          shasum -a 256 desKTop.dmg desKTop.zip > ../checksums.txt
          cd ..
          cat checksums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-release
          path: |
            build/desKTop.dmg
            build/desKTop.zip
            checksums.txt

  publish-release:
    name: Publish GitHub Release
    needs: build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-macos-release
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "desKTop"
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-assets/*
