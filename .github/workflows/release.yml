name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Application
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Tag / Version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="v1.0.0-dev"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building release for tag $TAG"

      - name: Swift Build Release
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Bundle macOS Application (.app)
        run: |
          APP_DIR="build/desKTop.app"
          CONTENTS_DIR="$APP_DIR/Contents"
          MACOS_DIR="$CONTENTS_DIR/MacOS"
          RESOURCES_DIR="$CONTENTS_DIR/Resources"

          rm -rf build
          mkdir -p "$MACOS_DIR" "$RESOURCES_DIR"

          BINARY_PATH=$(find .build -name "desKTop" -type f -perm +111 | grep -E "Release|release" | head -n 1)
          if [ -z "$BINARY_PATH" ]; then
            echo "Binary desKTop not found!"
            exit 1
          fi
          echo "Found binary at: $BINARY_PATH"
          cp "$BINARY_PATH" "$MACOS_DIR/desKTop"
          chmod +x "$MACOS_DIR/desKTop"

          if [ -d "Resources" ]; then
            cp -R Resources/* "$RESOURCES_DIR/" 2>/dev/null || true
          fi
          if [ -d "Sources/desKTopApp/Resources" ]; then
            cp -R Sources/desKTopApp/Resources/* "$RESOURCES_DIR/" 2>/dev/null || true
          fi

          cat << 'EOF' > "$CONTENTS_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>desKTop</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>xyz.fafolab.desktop</string>
              <key>CFBundleName</key>
              <string>desKTop</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSHumanReadableCopyright</key>
              <string>Copyright © 2026 FAFOlab (a FAFOlab joint). The Unlicense.</string>
          </dict>
          </plist>
          EOF

          cd build
          zip -r -y ../desKTop.zip desKTop.app
          cd ..
          shasum -a 256 desKTop.zip > checksums.txt
          cat checksums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-release
          path: |
            desKTop.zip
            checksums.txt

  publish-release:
    name: Publish GitHub Release
    needs: build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos-release
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "desKTop"
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-assets/*
