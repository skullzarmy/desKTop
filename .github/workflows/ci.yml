name: CI

on:
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app || true

      - name: Swift Version
        run: swift --version

      - name: Build Package
        run: swift build -v

      - name: Run Tests
        run: ./scripts/test.sh
